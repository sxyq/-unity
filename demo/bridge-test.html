<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桥接联调页（模拟平台学习页 + 实验上报）</title>
<link rel="stylesheet" href="shell.css">
<style>
  html, body { height: 100%; }
  .wrap { height: 100vh; display: flex; flex-direction: column; }
  .bar {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
    padding: 8px 12px; background: #1d3557; color: #eaf2ff; font-size: 12px;
  }
  .bar b { color: #ffce6a; }
  .bar button {
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12);
    color: #eaf2ff; border-radius: 999px; padding: 4px 10px; font-size: 12px;
    font-family: inherit; cursor: pointer;
  }
  iframe { flex: 1 1 auto; width: 100%; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <b>桥接联调</b>
    <span>模拟实验内容向平台上报（与 platform 的 postMessage 协议一致）：</span>
    <button id="btn-step">发一条步骤 ///</button>
    <button id="btn-result">发一条成绩 ***</button>
    <button id="btn-reset">发 ~~~</button>
    <span id="log" style="margin-left:auto;opacity:.8"></span>
  </div>
  <iframe src="run.html" title="实验内容（iframe 形态）"></iframe>
</div>

<script>
const log = (t) => { document.getElementById('log').textContent = t + ' · ' + new Date().toLocaleTimeString(); };

document.getElementById('btn-step').onclick = () => {
  // 平台 BaseLearning 里被拆成 data 传给 ScormDataUpload
  window.postMessage('OK///{"sceneId":3,"step":5,"stepTotal":27,"phase":"intraop"}', '*');
  log('已发步骤');
};

document.getElementById('btn-result').onclick = () => {
  // 平台会 JSON.parse 后连同 id 一起提交
  window.postMessage('***{"score":86,"steps":[{"no":9,"ok":false,"name":"牵引重量选择"},{"no":14,"ok":true,"name":"药物禁忌"}]}', '*');
  log('已发成绩');
};

document.getElementById('btn-reset').onclick = () => {
  window.postMessage('~~~', '*');
  log('已发重置计时');
};
</script>

<!-- 扩展运行时（预览垫片） -->
<script src="shim.js"></script>
<script src="../extension/src/case-data.js"></script>
<script src="../extension/src/prompt.js"></script>
<script src="../extension/src/instrument.js"></script>
<script src="../extension/src/bridge.js"></script>
<script src="../extension/src/score-parse.js"></script>
<script src="../extension/src/scene-detect.js"></script>
<script src="../extension/src/ui.js"></script>
<script src="../extension/src/main.js"></script>
</body>
</html>
