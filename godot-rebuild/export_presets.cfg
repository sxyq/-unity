[preset.0]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/*.json,assets/*.txt"
exclude_filter="**/._*,._*"
export_path="../builds/macOS/TractionCare.zip"

[preset.0.options]
export/architecture="universal"
application/bundle_identifier="com.hospitalsimulation.tractioncare"
application/short_version="0.1.0"
application/version="0.1.0"
application/category="public.app-category.education"
codesign/codesign=1
codesign/identity="-"
codesign/entitlements/disable_library_validation=true
codesign/entitlements/network_client=true
codesign/entitlements/network_server=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/*.json,assets/*.txt"
exclude_filter="**/._*,._*"
export_path="../builds/Windows/TractionCare.exe"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/company_name="Hospital Simulation"
application/product_name="骨牵引护理实验"
application/file_description="Independent nursing teaching simulation"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
