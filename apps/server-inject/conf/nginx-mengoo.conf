# =============================================================================
# 方案 T2：在现有站点前面加一层 nginx（或复用已有 nginx），用 sub_filter 注入
# -----------------------------------------------------------------------------
# 特点：不改原系统任何文件；关掉这段配置即完全回滚；升级不受影响。
# 前提：学校能在这台服务器（或它前面）加 nginx 配置。
#
# 放置位置：nginx.conf 的 http { } 内、对应 server { } 内
# 需要模块：ngx_http_sub_module（官方默认编译包含，可用 nginx -V 2>&1 | grep sub 确认）
# =============================================================================

# ---- 限流：防止有人刷我们的对话接口 ----
limit_req_zone $binary_remote_addr zone=ai_hook:10m rate=20r/m;

upstream mengoo_origin {
    # 原站真实地址。如果 nginx 就装在原服务器上，通常是 127.0.0.1:8080 / 5000 之类
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream ai_hook_service {
    # 我们的服务，只监听环回口
    server 127.0.0.1:8788;
    keepalive 8;
}

server {
    listen 443 ssl;
    server_name skeletaltraction.cqmu.edu.cn;

    # …… 证书配置保持学校原有设置 ……

    # ---------------------------------------------------------------------
    # 1) SPA 入口：注入一行 script
    # ---------------------------------------------------------------------
    location = /mengoo/ {
        proxy_pass http://mengoo_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sub_filter 必须关掉上游压缩，否则匹配不到 </head>
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/mengoo/__ai/hook.js" defer></script></head>';

        # 不要让浏览器缓存注入了脚本的 HTML，否则关闭功能后仍会加载
        add_header Cache-Control "no-store" always;
    }

    # 直接访问 index.html 时同样注入
    location = /mengoo/index.html {
        proxy_pass http://mengoo_origin;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/mengoo/__ai/hook.js" defer></script></head>';
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # 2) 智能服务：静态脚本 + 对话接口
    # ---------------------------------------------------------------------
    location /mengoo/__ai/ {
        proxy_pass http://ai_hook_service/;      # 注意结尾的 /，会剥掉前缀
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 必须关闭缓冲，否则回答会"攒着一次性吐出来"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;

        limit_req zone=ai_hook burst=5 nodelay;
    }

    # ---------------------------------------------------------------------
    # 3) 其余请求原样转发，一个字都不改
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://mengoo_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

    # ---------------------------------------------------------------------
    # 4) 关键：停掉 PWA 的 Service Worker
    #    平台的 sw.js 会把 index.html 预缓存，老用户根本不会再请求服务器，
    #    上面的注入对他们就失效了。实验室场景不需要离线能力，直接 404。
    #    已注册的 SW 会在下一次更新检查时被浏览器清掉（通常一次刷新后生效）。
    # ---------------------------------------------------------------------
    location = /mengoo/sw.js {
        return 404;
    }

# =============================================================================
# 如果只是想先试运行，可以只对特定 IP 生效（灰度）：
#
#   geo $ai_hook_on {
#       default 0;
#       10.10.20.0/24 1;      # 只对实训室网段注入
#   }
#   # 然后在 location 里：
#   set $inject '';
#   if ($ai_hook_on) { set $inject '<script src="/mengoo/__ai/hook.js" defer></script>'; }
#   sub_filter '</head>' '${inject}</head>';
#
# 注意：if 在 location 里只做变量赋值是安全的，不要写 proxy_pass。
# =============================================================================